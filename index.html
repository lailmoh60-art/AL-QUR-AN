const ZIKIR_DATA = [
  { title: "Subhanallah", arabic: "سُبْحَانَ اللَّهِ", translation: "Maha Suci Allah", target: 33 },

const FALLBACK_LOCATION = { lat: -6.2088, lng: 106.8456, label: "Jakarta (lokasi default)" };

const COLORS = {
  deep: "#0B3D2E",
  teal: "#1B5E4F",
  gold: "#C9A227",
  cream: "#F7F0E1",
  charcoal: "#1C1917",
};

function GeoPattern() {
  return (
    <svg width="100%" height="100%" viewBox="0 0 120 24" preserveAspectRatio="none">
      <defs>
        <pattern id="geo" width="24" height="24" patternUnits="userSpaceOnUse">
          <path d="M12 2 L22 12 L12 22 L2 12 Z" fill="none" stroke={COLORS.gold} strokeWidth="0.6" opacity="0.5" />
          <circle cx="12" cy="12" r="2" fill={COLORS.gold} opacity="0.4" />
        </pattern>
      </defs>
      <rect width="120" height="24" fill="url(#geo)" />
    </svg>
  );
}

function QuranApp() {
  const [activeTab, setActiveTab] = useState("quran");
  const [surahs, setSurahs] = useState([]);
  const [loadingList, setLoadingList] = useState(true);
  const [errorList, setErrorList] = useState(null);
  const [query, setQuery] = useState("");
  const [selected, setSelected] = useState(null);
  const [ayat, setAyat] = useState([]);
  const [loadingAyat, setLoadingAyat] = useState(false);
  const [errorAyat, setErrorAyat] = useState(null);
  const [favorites, setFavorites] = useState({});

  const [location, setLocation] = useState(null);
  const [locationStatus, setLocationStatus] = useState("loading");

  const requestUserLocation = () => {
    setLocationStatus("loading");
    if (!navigator.geolocation) {
      setLocation(FALLBACK_LOCATION);
      setLocationStatus("fallback");
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        setLocation({ lat: pos.coords.latitude, lng: pos.coords.longitude, label: "Lokasi GPS Aktif" });
        setLocationStatus("granted");
      },
      () => {
        setLocation(FALLBACK_LOCATION);
        setLocationStatus("fallback");
      },
      { timeout: 10000, maximumAge: 0, enableHighAccuracy: true }
    );
  };

  useEffect(() => {
    requestUserLocation();
  }, []);

  useEffect(() => {
    const handlePopState = () => {
      if (selected !== null) setSelected(null);
    };
    window.addEventListener("popstate", handlePopState);
    return () => window.removeEventListener("popstate", handlePopState);
  }, [selected]);

  const handleSelectSurah = (num) => {
    window.history.pushState({ surah: num }, "");
    setSelected(num);
  };

  const handleBack = () => {
    if (window.history.state && window.history.state.surah) {
      window.history.back();
    } else {
      setSelected(null);
    }
  };

  useEffect(() => {
    let cancelled = false;
    async function loadSurahs() {
      try {
        setLoadingList(true);
        setErrorList(null);
        const res = await fetch("https://api.alquran.cloud/v1/surah");
        if (!res.ok) throw new Error("Gagal");
        const data = await res.json();
        if (!cancelled) setSurahs(data.data || []);
      } catch (e) {
        if (!cancelled) setErrorList("Gagal memuat daftar surah.");
      } finally {
        if (!cancelled) setLoadingList(false);
      }
    }
    loadSurahs();
    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    if (!selected) return;
    let cancelled = false;
    async function loadAyat() {
      try {
        setLoadingAyat(true);
        setErrorAyat(null);
        const res = await fetch(`https://api.alquran.cloud/v1/surah/${selected}/editions/quran-uthmani,id.indonesian,ar.alafasy`);
        if (!res.ok) throw new Error("Gagal");
        const data = await res.json();
        let arabic = data.data[0]?.ayahs || [];
        const indo = data.data[1]?.ayahs || [];
        const audioData = data.data[2]?.ayahs || [];

        // Pemisahan bismillah agar Surah Al-Fatihah murni dimulai dari ayat "Al-Hamdu..."
        if (selected === 1 && arabic.length > 0) {
          arabic = arabic.slice(1);
        }

        const merged = arabic.map((a, i) => ({
          number: a.numberInSurah,
          arabic: a.text,
          translation: indo[selected === 1 ? i + 1 : i]?.text || "",
          audio: audioData[selected === 1 ? i + 1 : i]?.audio || "",
        }));
        if (!cancelled) setAyat(merged);
      } catch (e) {
        if (!cancelled) setErrorAyat("Gagal memuat ayat.");
      } finally {
        if (!cancelled) setLoadingAyat(false);
      }
    }
    loadAyat();
    return () => { cancelled = true; };
  }, [selected]);

  const filtered = useMemo(() => {
    if (!query.trim()) return surahs;
    const q = query.toLowerCase();
    return surahs.filter((s) => {
      const cleanName = (CLEAN_SURAH_NAMES[s.number] || s.englishName).toLowerCase();
      const indoMeaning = (INDO_MEANING[s.number] || "").toLowerCase();
      return cleanName.includes(q) || indoMeaning.includes(q) || String(s.number).includes(q);
    });
  }, [surahs, query]);

  const currentSurah = surahs.find((s) => s.number === selected);
  const toggleFav = (num) => setFavorites((f) => ({ ...f, [num]: !f[num] }));

  return (
    <div style={{ fontFamily: "'Plus Jakarta Sans', system-ui, sans-serif", background: COLORS.cream, minHeight: "100vh", color: COLORS.charcoal, paddingBottom: 70 }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        .arabic-text {
          font-family: 'Amiri', 'Traditional Arabic', serif;
          direction: rtl;
          text-align: right;
          letter-spacing: 0px;
          word-spacing: 2px;
        }
        .scrollbar-thin::-webkit-scrollbar { width: 4px; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: ${COLORS.gold}55; border-radius: 4px; }
        @keyframes spin { to { transform: rotate(360deg); } }
      `}</style>

      {selected ? (
        <DetailScreen
          surah={currentSurah}
          ayat={ayat}
          loading={loadingAyat}
          error={errorAyat}
          onBack={handleBack}
          isFav={!!favorites[selected]}
          onToggleFav={() => toggleFav(selected)}
        />
      ) : (
        <>
          {activeTab === "quran" && (
            <HomeScreen
              loading={loadingList}
              error={errorList}
              surahs={filtered}
              query={query}
              setQuery={setQuery}
              onSelect={handleSelectSurah}
              favorites={favorites}
              toggleFav={toggleFav}
            />
          )}
          {activeTab === "prayer" && (
            <PrayerScreen location={location} locationStatus={locationStatus} onRequestLocation={requestUserLocation} />
          )}
          {activeTab === "zikir" && (
            <ZikirScreen />
          )}
        </>
      )}

      {!selected && (
        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "#fff", borderTop: `1px solid ${COLORS.deep}15`, display: "flex", justifyContent: "space-around", padding: "10px 0", zIndex: 10, maxWidth: 480, margin: "0 auto" }}>
          <button onClick={() => setActiveTab("quran")} style={{ background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2, color: activeTab === "quran" ? COLORS.deep : "#888", fontSize: 11, fontWeight: 600 }}>
            <IconBookOpen size={20} color={activeTab === "quran" ? COLORS.deep : "#888"} />
            Al-Qur'an
          </button>
          <button onClick={() => setActiveTab("prayer")} style={{ background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2, color: activeTab === "prayer" ? COLORS.deep : "#888", fontSize: 11, fontWeight: 600 }}>
            <IconClock size={20} color={activeTab === "prayer" ? COLORS.deep : "#888"} />
            Sholat
          </button>
          <button onClick={() => setActiveTab("zikir")} style={{ background: "none", border: "none", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 2, color: activeTab === "zikir" ? COLORS.deep : "#888", fontSize: 11, fontWeight: 600 }}>
            <IconSparkles size={20} color={activeTab === "zikir" ? COLORS.deep : "#888"} />
            Zikir
          </button>
        </div>
      )}
    </div>
  );
}

function HomeScreen({ loading, error, surahs, query, setQuery, onSelect, favorites, toggleFav }) {
  return (
    <div style={{ maxWidth: 480, margin: "0 auto", paddingBottom: 24 }}>
      <div style={{ background: COLORS.deep, padding: "28px 20px 22px", borderBottomLeftRadius: 20, borderBottomRightRadius: 20 }}>
        <div style={{ height: 10, marginBottom: 18, opacity: 0.9 }}>
          <GeoPattern />
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
          <IconBookOpen size={22} color={COLORS.gold} />
          <span style={{ color: COLORS.gold, fontSize: 13, letterSpacing: 1.5, fontWeight: 600, textTransform: "uppercase" }}>
            Mushaf Digital
          </span>
        </div>
        <h1 style={{ color: COLORS.cream, fontSize: 26, fontWeight: 800, margin: "6px 0 2px" }}>Assalamu'alaikum</h1>
        <p style={{ color: COLORS.cream, opacity: 0.75, fontSize: 14, margin: 0 }}>114 surah, lengkap dengan audio & terjemahan</p>

        <div style={{ marginTop: 18, position: "relative" }}>
          <span style={{ position: "absolute", left: 14, top: "50%", transform: "translateY(-50%)" }}>
            <IconSearch size={16} color={COLORS.teal} />
          </span>
          <input
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="Cari nama surah..."
            style={{ width: "100%", padding: "12px 14px 12px 38px", borderRadius: 12, border: "none", background: COLORS.cream, fontSize: 14, fontFamily: "inherit" }}
          />
        </div>
      </div>

      <div style={{ padding: "18px 16px 0" }}>
        {loading && (
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "48px 0", color: COLORS.teal }}>
            <IconLoader size={26} color={COLORS.teal} />
            <p style={{ marginTop: 10, fontSize: 13 }}>Memuat daftar surah...</p>
          </div>
        )}
        {error && <div style={{ textAlign: "center", padding: "32px 16px", color: "#8B3A2B", fontSize: 14 }}>{error}</div>}
        {!loading && !error && surahs.map((s) => {
          const displayName = CLEAN_SURAH_NAMES[s.number] || s.englishName;
          return (
            <button
              key={s.number}
              onClick={() => onSelect(s.number)}
              style={{ width: "100%", display: "flex", alignItems: "center", gap: 14, background: "#fff", border: `1px solid ${COLORS.deep}14`, borderRadius: 14, padding: "13px 14px", marginBottom: 10, cursor: "pointer", textAlign: "left" }}
            >
              <div style={{ width: 38, height: 38, borderRadius: "50%", background: COLORS.deep, color: COLORS.gold, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: 14, flexShrink: 0 }}>
                {s.number}
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 700, fontSize: 15, color: COLORS.charcoal }}>{displayName}</div>
                <div style={{ fontSize: 12.5, color: COLORS.teal, marginTop: 1 }}>
                  {INDO_MEANING[s.number] || s.englishNameTranslation} · {s.numberOfAyahs} ayat
                </div>
              </div>
              <div className="arabic-text" style={{ fontSize: 20, color: COLORS.deep, flexShrink: 0 }}>{s.name}</div>
              <span onClick={(e) => { e.stopPropagation(); toggleFav(s.number); }} style={{ flexShrink: 0, marginLeft: 2 }}>
                <IconHeart size={16} color={COLORS.gold} fill={favorites[s.number] ? COLORS.gold : "none"} />
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function DetailScreen({ surah, ayat, loading, error, onBack, isFav, onToggleFav }) {
  const [playingIndex, setPlayingIndex] = useState(null);
  const audioRef = useRef(null);

  useEffect(() => {
    return () => {
      if (audioRef.current) audioRef.current.pause();
    };
  }, [ayat]);

  const playFrom = (index) => {
    if (index < 0 || index >= ayat.length) {
      setPlayingIndex(null);
      return;
    }
    if (audioRef.current) audioRef.current.pause();
    const audioUrl = ayat[index].audio;
    if (!audioUrl) {
      playFrom(index + 1);
      return;
    }
    const audio = new Audio(audioUrl);
    audioRef.current = audio;
    audio.onended = () => playFrom(index + 1);
    audio.play().then(() => setPlayingIndex(index)).catch(() => setPlayingIndex(null));
  };

  const stopAudio = () => {
    if (audioRef.current) audioRef.current.pause();
    setPlayingIndex(null);
  };

  const displayName = surah ? (CLEAN_SURAH_NAMES[surah.number] || surah.englishName) : "";
  const showBismillah = surah && surah.number !== 9;

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", minHeight: "100vh" }}>
      <div style={{ background: COLORS.deep, padding: "16px 16px 20px", position: "sticky", top: 0, zIndex: 5 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <button onClick={onBack} style={{ background: "transparent", border: "none", color: COLORS.cream, display: "flex", alignItems: "center", gap: 4, cursor: "pointer", fontSize: 14, fontFamily: "inherit", padding: 6 }}>
            <IconChevronLeft size={18} color={COLORS.cream} /> Kembali
          </button>
          <button onClick={onToggleFav} style={{ background: "transparent", border: "none", cursor: "pointer", padding: 6 }}>
            <IconHeart size={18} color={COLORS.gold} fill={isFav ? COLORS.gold : "none"} />
          </button>
        </div>
        {surah && (
          <div style={{ textAlign: "center", marginTop: 8 }}>
            <div className="arabic-text" style={{ color: COLORS.gold, fontSize: 30, marginBottom: 4, textAlign: "center" }}>{surah.name}</div>
            <div style={{ color: COLORS.cream, fontWeight: 700, fontSize: 17 }}>{displayName}</div>
            <div style={{ color: COLORS.cream, opacity: 0.7, fontSize: 12.5, marginTop: 2 }}>
              {INDO_MEANING[surah.number]} · {surah.numberOfAyahs} ayat
            </div>
          </div>
        )}
        {!loading && !error && ayat.length > 0 && (
          <button
            onClick={() => (playingIndex !== null ? stopAudio() : playFrom(0))}
            style={{ marginTop: 14, width: "100%", background: playingIndex !== null ? COLORS.gold : "rgba(255,255,255,0.12)", color: playingIndex !== null ? COLORS.deep : "#fff", border: "none", borderRadius: 10, padding: "10px 0", fontWeight: 700, fontSize: 13, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}
          >
            {playingIndex !== null ? <IconPause size={15} color={COLORS.deep} /> : <IconPlay size={15} color="#fff" />}
            {playingIndex !== null ? `Berhenti (Ayat ${ayat[playingIndex]?.number})` : "Putar Semua Ayat Berurutan"}
          </button>
        )}
      </div>

      <div style={{ padding: "18px 16px 40px" }}>
        {loading && (
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "48px 0", color: COLORS.teal }}>
            <IconLoader size={26} color={COLORS.teal} />
            <p style={{ marginTop: 10, fontSize: 13 }}>Memuat ayat & audio...</p>
          </div>
        )}
        {error && <div style={{ textAlign: "center", padding: "32px 16px", color: "#8B3A2B", fontSize: 14 }}>{error}</div>}
        
        {!loading && !error && showBismillah && (
          <div style={{ background: "#fff", borderRadius: 14, padding: "18px", marginBottom: 14, border: `1px solid ${COLORS.deep}12`, textAlign: "center" }}>
            <p className="arabic-text" style={{ fontSize: 24, lineHeight: 2.2, fontWeight: 700, color: COLORS.gold, margin: 0, textAlign: "center" }}>
              بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
            </p>
          </div>
        )}

        {!loading && !error && ayat.map((a, idx) => (
          <div key={a.number}>
            <div style={{ background: "#fff", borderRadius: 14, padding: "18px 16px", marginBottom: 12, border: `1px solid ${COLORS.deep}12`, boxShadow: playingIndex === idx ? `0 0 0 2px ${COLORS.gold}` : "none" }}>
              <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 8 }}>
                <span style={{ width: 24, height: 24, borderRadius: "50%", background: COLORS.cream, color: COLORS.deep, fontSize: 11, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", border: `1px solid ${COLORS.gold}55` }}>
                  {a.number}
                </span>
              </div>
              <p className="arabic-text" style={{ fontSize: 26, lineHeight: 2.4, fontWeight: 700, color: COLORS.charcoal, margin: "0 0 14px" }}>{a.arabic}</p>
              <p style={{ fontSize: 13.5, lineHeight: 1.6, color: COLORS.teal, margin: "0 0 14px" }}>{a.translation}</p>

              <div style={{ display: "flex", justifyContent: "flex-start", borderTop: `1px solid ${COLORS.cream}`, paddingTop: 10 }}>
                <button
                  onClick={() => (playingIndex === idx ? stopAudio() : playFrom(idx))}
                  style={{ background: playingIndex === idx ? COLORS.gold : COLORS.cream, color: playingIndex === idx ? "#fff" : COLORS.deep, border: `1px solid ${COLORS.gold}55`, borderRadius: 8, padding: "6px 12px", fontSize: 12, fontWeight: 600, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}
                >
                  {playingIndex === idx ? <IconPause size={14} color="#fff" /> : <IconPlay size={14} color={COLORS.deep} />}
                  {playingIndex === idx ? "Jeda Audio" : "Putar Audio"}
                </button>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

const PRAYER_NAMES = {
  Imsak: "Imsak",
  Fajr: "Subuh",
  Dhuhr: "Dzuhur",
  Asr: "Ashar",
  Maghrib: "Maghrib",
  Isha: "Isya",
};

const ADHAN_AUDIO_URL = "https://cdn.islamic.network/adhan/audio/azan1.mp3";

function PrayerScreen({ location, locationStatus, onRequestLocation }) {
  const [timings, setTimings] = useState(null);
  const [loadingTimings, setLoadingTimings] = useState(false);
  const [errorTimings, setErrorTimings] = useState(null);
  const [subTab, setSubTab] = useState("jadwal");
  const [qibla, setQibla] = useState(null);
  const [loadingQibla, setLoadingQibla] = useState(false);
  const [errorQibla, setErrorQibla] = useState(null);
  
  const [heading, setHeading] = useState(0);
  const [sensorActive, setSensorActive] = useState(false);
  const [sensorError, setSensorError] = useState("");

  const [playingKey, setPlayingKey] = useState(null);
  const [audioError, setAudioError] = useState(false);
  const audioRef = useRef(null);

  useEffect(() => {
    if (!location) return;
    let cancelled = false;
    async function fetchTimings() {
      try {
        setLoadingTimings(true);
        setErrorTimings(null);
        const timestamp = Math.floor(Date.now() / 1000);
        const res = await fetch(`https://api.aladhan.com/v1/timings/${timestamp}?latitude=${location.lat}&longitude=${location.lng}&method=20`);
        if (!res.ok) throw new Error("Gagal");
        const data = await res.json();
        if (!cancelled) setTimings(data?.data?.timings || null);
      } catch (e) {
        if (!cancelled) setErrorTimings("Gagal memuat jadwal sholat.");
      } finally {
        if (!cancelled) setLoadingTimings(false);
      }
    }
    fetchTimings();
    return () => { cancelled = true; };
  }, [location]);

  useEffect(() => {
    if (!location || subTab !== "kiblat") return;
    let cancelled = false;
    async function fetchQibla() {
      try {
        setLoadingQibla(true);
        setErrorQibla(null);
        const res = await fetch(`https://api.aladhan.com/v1/qibla/${location.lat}/${location.lng}`);
        if (!res.ok) throw new Error("Gagal");
        const data = await res.json();
        if (!cancelled) setQibla(data?.data?.direction ?? null);
      } catch (e) {
        if (!cancelled) setErrorQibla("Gagal memuat arah kiblat.");
      } finally {
        if (!cancelled) setLoadingQibla(false);
      }
    }
    fetchQibla();
    return () => { cancelled = true; };
  }, [location, subTab]);

  const startCompass = async () => {
    setSensorError("");
    if (typeof window !== "undefined" && window.DeviceOrientationEvent) {
      if (typeof DeviceOrientationEvent.requestPermission === "function") {
        try {
          const response = await DeviceOrientationEvent.requestPermission();
          if (response === "granted") {
            window.addEventListener("deviceorientation", handleOrientation, true);
            setSensorActive(true);
          } else {
            setSensorError("Izin sensor kompas ditolak.");
          }
        } catch (err) {
          setSensorError("Sensor kompas tidak didukung perangkat ini.");
        }
      } else {
        window.addEventListener("deviceorientation", handleOrientation, true);
        setSensorActive(true);
      }
    } else {
      setSensorError("Perangkat tidak mendukung sensor arah (kompas).");
    }
  };

  const handleOrientation = (e) => {
    let compass = null;
    if (e.webkitCompassHeading !== undefined) {
      compass = e.webkitCompassHeading;
    } else if (e.alpha !== null) {
      compass = 360 - e.alpha;
    }
    if (compass !== null) {
      setHeading(compass);
    }
  };

  useEffect(() => {
    return () => {
      window.removeEventListener("deviceorientation", handleOrientation, true);
    };
  }, []);

  const playAdhan = (key) => {
    if (audioRef.current) audioRef.current.pause();
    setAudioError(false);
    const audio = new Audio(ADHAN_AUDIO_URL);
    audioRef.current = audio;
    audio.onended = () => setPlayingKey(null);
    audio.play().then(() => setPlayingKey(key)).catch(() => {
      setAudioError(true);
      setPlayingKey(null);
    });
  };

  const stopAdhan = () => {
    if (audioRef.current) audioRef.current.pause();
    setPlayingKey(null);
  };

  const rotationAngle = qibla !== null ? qibla - heading : 0;

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", paddingBottom: 32 }}>
      <div style={{ background: COLORS.deep, padding: "28px 20px 22px", borderBottomLeftRadius: 20, borderBottomRightRadius: 20, color: "#fff" }}>
        <IconClock size={22} color={COLORS.gold} />
        <h1 style={{ color: COLORS.cream, fontSize: 24, fontWeight: 800, margin: "6px 0 2px" }}>Sholat</h1>
        
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 4 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, color: COLORS.cream, opacity: 0.8, fontSize: 12.5 }}>
            <IconMapPin size={13} color={COLORS.cream} />
            {location ? location.label : "Mendeteksi lokasi..."}
          </div>
          <button onClick={onRequestLocation} style={{ background: "rgba(255,255,255,0.15)", border: "none", color: COLORS.gold, fontSize: 11, fontWeight: 700, padding: "4px 8px", borderRadius: 6, cursor: "pointer" }}>
            Refresh GPS
          </button>
        </div>

        <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
          <button
            onClick={() => setSubTab("jadwal")}
            style={{ flex: 1, padding: "9px 0", borderRadius: 10, border: "none", cursor: "pointer", fontWeight: 700, fontSize: 13, background: subTab === "jadwal" ? COLORS.gold : "rgba(255,255,255,0.12)", color: subTab === "jadwal" ? COLORS.deep : "#fff" }}
          >
            Jadwal Sholat
          </button>
          <button
            onClick={() => setSubTab("kiblat")}
            style={{ flex: 1, padding: "9px 0", borderRadius: 10, border: "none", cursor: "pointer", fontWeight: 700, fontSize: 13, background: subTab === "kiblat" ? COLORS.gold : "rgba(255,255,255,0.12)", color: subTab === "kiblat" ? COLORS.deep : "#fff" }}
          >
            Arah Kiblat
          </button>
        </div>
      </div>

      {subTab === "jadwal" && (
        <div style={{ padding: "18px 16px" }}>
          {loadingTimings && (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "48px 0", color: COLORS.teal }}>
              <IconLoader size={26} color={COLORS.teal} />
              <p style={{ marginTop: 10, fontSize: 13 }}>Memuat jadwal sholat...</p>
            </div>
          )}
          {errorTimings && <div style={{ textAlign: "center", padding: "32px 16px", color: "#8B3A2B", fontSize: 14 }}>{errorTimings}</div>}

          {!loadingTimings && !errorTimings && timings && Object.keys(PRAYER_NAMES).map((key) => {
            const isPlaying = playingKey === key;
            return (
              <div key={key} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "#fff", padding: "14px 18px", borderRadius: 12, marginBottom: 10, border: `1px solid ${COLORS.deep}12` }}>
                <div>
                  <div style={{ color: COLORS.charcoal, fontSize: 15, fontWeight: 700 }}>{PRAYER_NAMES[key]}</div>
                  <div style={{ color: COLORS.teal, fontSize: 13, fontWeight: 500, marginTop: 2 }}>{timings[key]}</div>
                </div>
                <button
                  onClick={() => (isPlaying ? stopAdhan() : playAdhan(key))}
                  style={{ background: isPlaying ? COLORS.gold : COLORS.cream, color: COLORS.deep, border: `1px solid ${COLORS.gold}55`, padding: "8px 12px", borderRadius: 8, fontSize: 12, fontWeight: 600, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}
                >
                  {isPlaying ? <IconPause size={14} color={COLORS.deep} /> : <IconVolume size={14} color={COLORS.deep} />}
                  {isPlaying ? "Berhenti" : "Tes Adzan"}
                </button>
              </div>
            );
          })}
          {audioError && (
            <p style={{ textAlign: "center", fontSize: 12, color: "#8B3A2B", marginTop: 8 }}>
              Audio adzan gagal dimuat — coba lagi atau cek koneksi internet.
            </p>
          )}
        </div>
      )}

      {subTab === "kiblat" && (
        <div style={{ padding: "18px 16px", textAlign: "center" }}>
          {loadingQibla && (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "48px 0", color: COLORS.teal }}>
              <IconLoader size={26} color={COLORS.teal} />
              <p style={{ marginTop: 10, fontSize: 13 }}>Menghitung arah kiblat...</p>
            </div>
          )}
          {errorQibla && <div style={{ padding: "32px 16px", color: "#8B3A2B", fontSize: 14 }}>{errorQibla}</div>}

          {!loadingQibla && !errorQibla && qibla !== null && (
            <div style={{ background: "#fff", borderRadius: 16, padding: "20px 16px", border: `1px solid ${COLORS.deep}12` }}>
              
              {!sensorActive ? (
                <div style={{ marginBottom: 16, padding: "12px", background: COLORS.cream, borderRadius: 10 }}>
                  <p style={{ fontSize: 13, color: COLORS.deep, fontWeight: 600, margin: "0 0 10px" }}>
                    Aktifkan sensor kompas agar jarum bergerak akurat saat HP diputar:
                  </p>
                  <button onClick={startCompass} style={{ background: COLORS.gold, color: COLORS.deep, border: "none", padding: "10px 18px", borderRadius: 8, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>
                    Aktifkan Kompas HP
                  </button>
                  {sensorError && <p style={{ fontSize: 11, color: "#8B3A2B", marginTop: 6 }}>{sensorError}</p>}
                </div>
              ) : (
                <p style={{ fontSize: 12, color: COLORS.teal, fontWeight: 600, marginBottom: 8 }}>
                  🟢 Kompas aktif. Putar HP sampai jarum pas di atas.
                </p>
              )}

              <div style={{ position: "relative", width: 220, height: 220, margin: "0 auto" }}>
                <svg width="220" height="220" viewBox="0 0 220 220">
                  <circle cx="110" cy="110" r="100" fill={COLORS.cream} stroke={COLORS.deep} strokeWidth="2" />
                  <text x="110" y="24" textAnchor="middle" fontSize="14" fontWeight="700" fill={COLORS.deep}>U</text>
                  <text x="196" y="115" textAnchor="middle" fontSize="14" fontWeight="700" fill={COLORS.teal}>T</text>
                  <text x="110" y="204" textAnchor="middle" fontSize="14" fontWeight="700" fill={COLORS.teal}>S</text>
                  <text x="24" y="115" textAnchor="middle" fontSize="14" fontWeight="700" fill={COLORS.teal}>B</text>
                  
                  <g transform={`rotate(${rotationAngle} 110 110)`} style={{ transition: "transform 0.08s ease-out" }}>
                    <line x1="110" y1="110" x2="110" y2="30" stroke={COLORS.gold} strokeWidth="4" strokeLinecap="round" />
                    <polygon points="110,20 102,38 118,38" fill={COLORS.gold} />
                  </g>
                  <circle cx="110" cy="110" r="6" fill={COLORS.deep} />
                </svg>
              </div>

              <p style={{ fontSize: 22, fontWeight: 800, color: COLORS.deep, margin: "16px 0 4px" }}>{qibla.toFixed(1)}°</p>
              <p style={{ fontSize: 12.5, color: COLORS.teal, margin: 0 }}>Sudut kiblat dari Utara · Heading HP: {heading.toFixed(0)}°</p>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function ZikirCard({ item }) {
  const [count, setCount] = useState(0);
  return (
    <div style={{ background: "#fff", borderRadius: 14, padding: "18px", marginBottom: 14, border: `1px solid ${COLORS.deep}12`, textAlign: "center" }}>
      <div style={{ fontWeight: 700, fontSize: 16, color: COLORS.charcoal, marginBottom: 8 }}>{item.title}</div>
      <div className="arabic-text" style={{ fontSize: 26, color: COLORS.deep, margin: "10px 0", textAlign: "center" }}>{item.arabic}</div>
      <div style={{ fontSize: 13, color: COLORS.teal, marginBottom: 14 }}>{item.translation}</div>
      <div style={{ fontSize: 20, fontWeight: 800, color: COLORS.gold, marginBottom: 10 }}>{count} / {item.target}</div>
      <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
        <button onClick={() => setCount(count + 1)} style={{ background: COLORS.deep, color: "#fff", border: "none", padding: "10px 24px", borderRadius: 10, fontWeight: 700, cursor: "pointer", fontSize: 14 }}>
          Hitung (+1)
        </button>
        <button onClick={() => setCount(0)} style={{ background: COLORS.cream, color: COLORS.deep, border: `1px solid ${COLORS.deep}22`, padding: "10px 16px", borderRadius: 10, fontWeight: 600, cursor: "pointer", fontSize: 14 }}>
          Reset
        </button>
      </div>
    </div>
  );
}

function ZikirScreen() {
  return (
    <div style={{ maxWidth: 480, margin: "0 auto", paddingBottom: 32 }}>
      <div style={{ background: COLORS.deep, padding: "28px 20px 22px", borderBottomLeftRadius: 20, borderBottomRightRadius: 20, color: "#fff" }}>
        <IconSparkles size={22} color={COLORS.gold} />
        <h1 style={{ color: COLORS.cream, fontSize: 24, fontWeight: 800, margin: "6px 0 2px" }}>Zikir Harian</h1>
        <p style={{ color: COLORS.cream, opacity: 0.75, fontSize: 14, margin: 0 }}>Hitung bacaan zikir harianmu</p>
      </div>
      <div style={{ padding: "18px 16px" }}>
        {ZIKIR_DATA.map((item, idx) => (
          <ZikirCard key={idx} item={item} />
        ))}
      </div>
    </div>
  );
}

root.render(<QuranApp />);
</script>
